<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kata DNI</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <div class="card">
    <h1>Calcula tu letra del DNI</h1>
    <label for="dni">Número de DNI:</label>
    <input type="text" id="dni" maxlength="8" placeholder="12345678">
    <button class="card button" id="btnCalcular">Calcular</button>
    <p id="resultado"></p>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
